<!doctype html>
<!-- Source for assets/social-preview.png (1200×630). Regenerate with: npm run social-preview -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview</title>
<style>
  @font-face { font-family: 'Newsreader'; src: url('../assets/fonts/newsreader-opsz.woff2') format('woff2'); font-style: normal; font-weight: 200 800; }
  @font-face { font-family: 'Newsreader'; src: url('../assets/fonts/newsreader-opsz-italic.woff2') format('woff2'); font-style: italic; font-weight: 200 800; }
  @font-face { font-family: 'Public Sans'; src: url('../assets/fonts/public-sans.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('../assets/fonts/ibm-plex-mono-400.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('../assets/fonts/ibm-plex-mono-500.woff2') format('woff2'); font-weight: 500; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F3F4F0; color: #12161D; }
  .card { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 560px 1fr; gap: 48px; padding: 56px 64px; box-sizing: border-box; }
  .copy { display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 12px; font: 500 22px/1 'Public Sans', sans-serif; }
  .brand svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .eyebrow { margin: 56px 0 18px; font: 500 15px/1.4 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: #535D68; }
  h1 { margin: 0; font: 400 66px/1.02 'Newsreader', serif; letter-spacing: -.015em; }
  h1 em { background: linear-gradient(transparent 58%, #F3DE4F 58%, #F3DE4F 92%, transparent 92%); padding-inline: .06em; }
  .url { margin-top: auto; font: 400 17px/1 'IBM Plex Mono', monospace; color: #535D68; }
  canvas { width: 100%; height: 100%; display: block; border: 1px solid #D2D6CE; box-sizing: border-box; }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <div class="brand"><svg viewBox="0 0 80 80" aria-hidden="true"><path d="M23 59 6 74V6L74 74V6L45 33M15 35l27 27"/></svg>Manheim Consulting</div>
    <p class="eyebrow">Source code analysis for software litigation</p>
    <h1>Somewhere in a million lines is <em>the one</em> that matters.</h1>
    <p class="url">manheimconsultingexperts.com</p>
  </div>
  <canvas id="c"></canvas>
</div>
<script type="module">
  import { buildCorpus, computeLayout, lineY, citation, GUT, HEAD } from '../src/lens.js';
  await document.fonts.ready;
  const cv = document.getElementById('c'), r = cv.getBoundingClientRect(), dpr = 2;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const g = computeLayout(r.width, r.height), files = buildCorpus(), MONO = '"IBM Plex Mono", monospace';
  const MINI = { k: 'rgba(29,63,207,.55)', t: 'rgba(18,22,29,.55)', i: 'rgba(62,71,82,.34)', s: 'rgba(138,90,11,.45)', n: 'rgba(138,90,11,.45)', c: 'rgba(120,130,124,.3)', p: 'rgba(107,116,126,.25)' };
  const COLORS = { k: '#1D3FCF', t: '#12161D', i: '#3E4752', s: '#8A5A0B', n: '#8A5A0B', c: '#8C958F', p: '#6B747E' };
  const shown = files.map((f, i) => [f, g.xs.get(i)]).filter(([, x]) => x !== undefined);
  ctx.fillStyle = '#E8EAE4'; ctx.fillRect(0, 0, g.W, g.H);
  for (const [f, x] of shown) {
    ctx.fillStyle = '#535D68'; ctx.font = `500 10px ${MONO}`; ctx.fillText(f.name, x, 18);
    ctx.fillStyle = '#D2D6CE'; ctx.fillRect(x, 24, g.colW, 1);
    for (let i = 0; i < g.maxLines; i++) for (const tk of f.toks[i]) {
      ctx.fillStyle = MINI[tk.k];
      ctx.fillRect(x + (GUT + tk.x) * g.cw, lineY(g, i), Math.max(g.cw * tk.t.length - g.cw * .3, g.cw * .6), g.lh * .6);
    }
    if (f.el) { ctx.fillStyle = 'rgba(243,222,79,.85)'; ctx.fillRect(x + GUT * g.cw - 2, lineY(g, f.evidence) - g.lh * .45, f.lines[f.evidence].length * g.cw + 4, g.lh * 1.5); }
  }
  // A larger lens resting on the middle column's cited line, fully inside the panel.
  const [f, x] = shown.find(([s]) => s.el === '1b');
  const R = 132, mag = g.mag, lx = Math.min(Math.max(x + g.colW / 2, R + 12), g.W - R - 12), ly = lineY(g, f.evidence) + g.lh * .3;
  const sx = v => lx + (v - lx) * mag, sy = v => ly + (v - ly) * mag;
  ctx.save(); ctx.shadowColor = 'rgba(18,22,29,.22)'; ctx.shadowBlur = 28; ctx.shadowOffsetY = 10;
  ctx.beginPath(); ctx.arc(lx, ly, R, 0, Math.PI * 2); ctx.fillStyle = '#FBFBF9'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(lx, ly, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = 'rgba(243,222,79,.8)';
  ctx.fillRect(sx(x + GUT * g.cw) - 3, ly - g.lh * mag * .55, f.lines[f.evidence].length * g.cw * mag + 6, g.lh * mag * 1.1);
  ctx.font = `400 ${(g.cw / .6) * mag}px ${MONO}`; ctx.textBaseline = 'middle';
  const rr = R / mag;
  for (let i = Math.max(0, Math.floor((ly - rr - HEAD) / g.lh)); i <= Math.ceil((ly + rr - HEAD) / g.lh); i++) {
    const y = sy(lineY(g, i) + g.lh * .3);
    ctx.fillStyle = '#A3AAA4'; ctx.fillText(String(f.start + i).padStart(4), sx(x), y);
    for (const tk of f.toks[i]) { ctx.fillStyle = COLORS[tk.k]; ctx.fillText(tk.t, sx(x + (GUT + tk.x) * g.cw), y); }
  }
  ctx.restore();
  ctx.strokeStyle = '#12161D'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(lx, ly, R, 0, Math.PI * 2); ctx.stroke();
  for (const [a, b] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) { ctx.beginPath(); ctx.moveTo(lx + a * (R - 8), ly + b * (R - 8)); ctx.lineTo(lx + a * (R + 10), ly + b * (R + 10)); ctx.stroke(); }
  const label = citation(f); ctx.font = `500 13px ${MONO}`;
  const w = ctx.measureText(label).width + 16, tx = Math.min(Math.max(lx - w / 2, 6), g.W - w - 6), ty = Math.min(ly + R + 18, g.H - 30);
  ctx.fillStyle = '#12161D'; ctx.fillRect(tx, ty, w, 24); ctx.fillStyle = '#F3DE4F'; ctx.textBaseline = 'middle'; ctx.fillText(label, tx + 8, ty + 12);
  document.body.dataset.ready = 'true';
</script>
</body>
</html>
